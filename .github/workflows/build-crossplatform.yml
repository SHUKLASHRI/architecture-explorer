name: Build macOS DMG and Linux AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend-react
          npm ci
          npm run build
          cd ..

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build macOS App Bundle with PyInstaller
        run: |
          pyinstaller --noconfirm architecture_explorer.spec

      - name: Create macOS DMG
        run: |
          mkdir -p dmg_stage
          cp -R "dist/IrminsulIDE.app" dmg_stage/
          ln -s /Applications dmg_stage/Applications
          # Ad-hoc sign bundle so Gatekeeper recognizes valid application structure
          codesign --force --deep --sign - "dmg_stage/IrminsulIDE.app" || true
          hdiutil create -volname "Irminsul IDE" -srcfolder dmg_stage -ov -format UDZO "dist/IrminsulIDE-v1.0.0-macOS.dmg"
          ls -lh dist/

      - name: Upload DMG to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 "dist/IrminsulIDE-v1.0.0-macOS.dmg" --clobber

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgirepository1.0-dev python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 desktop-file-utils file

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          cd frontend-react
          npm ci
          npm run build
          cd ..

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Linux Binary with PyInstaller
        run: |
          pyinstaller --noconfirm architecture_explorer.spec
          chmod +x dist/IrminsulIDE

      - name: Build AppImage & Tarball
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          mkdir -p AppDir/usr/share/applications
          
          cp dist/IrminsulIDE AppDir/usr/bin/
          cp logo.svg AppDir/usr/share/icons/hicolor/scalable/apps/irminsulide.svg 2>/dev/null || true
          cp logo.svg AppDir/irminsulide.svg 2>/dev/null || true
          
          cat << 'EOF' > AppDir/irminsulide.desktop
          [Desktop Entry]
          Type=Application
          Name=Irminsul IDE
          Exec=IrminsulIDE
          Icon=irminsulide
          Categories=Development;IDE;
          Terminal=false
          EOF
          cp AppDir/irminsulide.desktop AppDir/usr/share/applications/
          
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/IrminsulIDE" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "dist/IrminsulIDE-v1.0.0-x86_64.AppImage"
          tar -czvf "dist/IrminsulIDE-v1.0.0-Linux-x64.tar.gz" -C dist IrminsulIDE
          ls -lh dist/

      - name: Upload Linux Artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 "dist/IrminsulIDE-v1.0.0-x86_64.AppImage" "dist/IrminsulIDE-v1.0.0-Linux-x64.tar.gz" --clobber
