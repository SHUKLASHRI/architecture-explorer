<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Architecture Explorer — Python Architecture &amp; Refactor Workbench</title>

    <!-- Google Fonts: JetBrains Mono for code -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Material Symbols Outlined -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#1e1e1e] text-[#cccccc] text-xs antialiased overflow-hidden h-screen w-screen flex flex-col select-none">
    <div id="root" class="h-full w-full flex flex-col overflow-hidden bg-[#1e1e1e]">
      <!-- Instant VS Code Splash Screen (prevents any raw code or layout flashes) -->
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;width:100vw;background:#1e1e1e;color:#cccccc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#007acc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
          <span style="font-size:14px;font-weight:600;letter-spacing:0.3px;color:#ffffff;">Architecture Explorer</span>
        </div>
        <div style="font-size:11px;color:#858585;display:flex;align-items:center;gap:8px;">
          <div style="width:12px;height:12px;border:2px solid #007acc;border-top-color:transparent;border-radius:50%;animation:vscSpin 0.7s linear infinite;"></div>
          <span>Loading Python Architecture Workbench...</span>
        </div>
        <style>
          @keyframes vscSpin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
